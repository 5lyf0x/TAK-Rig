<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TAK Rig Screenshots</title>
<style>
:root {
  --bg:#0a1015;
  --panel:#101820;
  --panel-2:#151f28;
  --line:#2c3a46;
  --text:#edf6fb;
  --muted:#9db1bd;
  --accent:#40b8ff;
}
* { box-sizing:border-box; }
html,body { margin:0; background:var(--bg); color:var(--text); font-family:Inter,Segoe UI,Roboto,Arial,sans-serif; }
body.modal-open { overflow:hidden; }
.page { max-width:1540px; margin:0 auto; padding:28px 22px 50px; }
.header { display:flex; align-items:flex-end; justify-content:space-between; gap:20px; margin-bottom:18px; }
h1 { margin:0; font-size:28px; letter-spacing:.01em; }
.sub { color:var(--muted); font-size:13px; margin-top:6px; }
.count { color:var(--muted); font-size:12px; white-space:nowrap; }
.gallery {
  display:grid;
  grid-template-columns:repeat(6,minmax(0,1fr));
  gap:12px;
}
.thumb {
  appearance:none;
  border:1px solid var(--line);
  background:var(--panel);
  border-radius:10px;
  padding:8px;
  color:var(--text);
  cursor:pointer;
  text-align:left;
  transition:transform .14s ease,border-color .14s ease,box-shadow .14s ease;
}
.thumb:hover {
  transform:translateY(-2px);
  border-color:var(--accent);
  box-shadow:0 8px 24px rgba(0,0,0,.28);
}
.thumb:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
.thumb-image-wrap {
  aspect-ratio:16/10;
  border-radius:7px;
  overflow:hidden;
  background:#05080a;
  border:1px solid #202d36;
}
.thumb img {
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}
.thumb-caption {
  min-height:34px;
  display:flex;
  align-items:center;
  font-size:11px;
  line-height:1.25;
  font-weight:800;
  padding:7px 2px 1px;
}

/* Modal */
.modal {
  position:fixed;
  inset:0;
  display:none;
  z-index:999;
  background:rgba(0,0,0,.88);
  backdrop-filter:blur(5px);
}
.modal.show { display:block; }
.modal-shell {
  height:100%;
  display:grid;
  grid-template-rows:auto 1fr auto;
  padding:14px 18px 16px;
}
.modal-top {
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:16px;
  padding:4px 2px 10px;
}
.modal-title {
  font-size:18px;
  font-weight:900;
  min-width:0;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.close-btn {
  width:42px;
  height:42px;
  border-radius:9px;
  border:1px solid #53646f;
  background:#18232b;
  color:white;
  font-size:24px;
  cursor:pointer;
  flex:0 0 auto;
}
.stage {
  position:relative;
  min-height:0;
  overflow:auto;
  text-align:center;
}
.stage img {
  width:auto;
  height:auto;
  max-width:none;
  max-height:none;
  object-fit:none;
  display:inline-block;
  vertical-align:top;
  border-radius:10px;
  border:1px solid #364650;
  box-shadow:0 20px 60px rgba(0,0,0,.55);
  background:#06090b;
}
.nav-arrow {
  position:absolute;
  top:50%;
  transform:translateY(-50%);
  width:50px;
  height:70px;
  border-radius:10px;
  border:1px solid #52636f;
  background:rgba(21,31,40,.88);
  color:white;
  font-size:28px;
  font-weight:800;
  cursor:pointer;
}
.nav-arrow:hover { border-color:var(--accent); background:#183141; }
.nav-arrow.prev { left:8px; }
.nav-arrow.next { right:8px; }
.modal-bottom {
  display:flex;
  align-items:center;
  justify-content:center;
  gap:12px;
  flex-wrap:wrap;
  padding-top:10px;
}
.nav-btn {
  border:1px solid #53646f;
  background:#17232b;
  color:white;
  border-radius:8px;
  padding:9px 14px;
  font-size:12px;
  font-weight:850;
  cursor:pointer;
}
.nav-btn:hover { border-color:var(--accent); }
.counter {
  color:#c5d4dc;
  font-size:12px;
  min-width:82px;
  text-align:center;
}
.hint {
  margin-top:18px;
  color:var(--muted);
  font-size:12px;
  text-align:center;
}

@media(max-width:1200px) {
  .gallery { grid-template-columns:repeat(4,minmax(0,1fr)); }
}
@media(max-width:820px) {
  .gallery { grid-template-columns:repeat(3,minmax(0,1fr)); }
  .nav-arrow { width:42px;height:62px; }
}
@media(max-width:560px) {
  .page { padding:20px 12px 40px; }
  .gallery { grid-template-columns:repeat(2,minmax(0,1fr)); gap:9px; }
  .header { align-items:flex-start; flex-direction:column; gap:6px; }
  .modal-shell { padding:10px 8px 12px; }
  .nav-arrow { display:none; }
  .modal-title { font-size:15px; }
}
</style>
</head>
<body>
<div class="page">
  <div class="header">
    <div>
      <h1>TAK Rig Screenshots</h1>
      <div class="sub">Click any thumbnail to open the full-size screenshot.</div>
    </div>
    <div class="count">21 screenshots</div>
  </div>

  <div class="gallery">
    
      <button class="thumb" type="button" onclick="openModal(0)" aria-label="Open ADS-B Aircraft Tracking">
        <div class="thumb-image-wrap">
          <img src="https://raw.githubusercontent.com/5lyf0x/TAK-Rig/main/screenshots/ADSB.png" alt="ADS-B Aircraft Tracking" loading="lazy">
        </div>
        <div class="thumb-caption">ADS-B Aircraft Tracking</div>
      </button>
    

      <button class="thumb" type="button" onclick="openModal(1)" aria-label="Open Route Details & Elevation Profile">
        <div class="thumb-image-wrap">
          <img src="https://raw.githubusercontent.com/5lyf0x/TAK-Rig/main/screenshots/ROUTE.png" alt="Route Details & Elevation Profile" loading="lazy">
        </div>
        <div class="thumb-caption">Route Details & Elevation Profile</div>
      </button>
    

      <button class="thumb" type="button" onclick="openModal(2)" aria-label="Open Basemap Selection">
        <div class="thumb-image-wrap">
          <img src="https://raw.githubusercontent.com/5lyf0x/TAK-Rig/main/screenshots/BASEMAPS.png" alt="Basemap Selection" loading="lazy">
        </div>
        <div class="thumb-caption">Basemap Selection</div>
      </button>
    

      <button class="thumb" type="button" onclick="openModal(3)" aria-label="Open Offline Map Download Setup">
        <div class="thumb-image-wrap">
          <img src="https://raw.githubusercontent.com/5lyf0x/TAK-Rig/main/screenshots/OFFLINEMAP_1.png" alt="Offline Map Download Setup" loading="lazy">
        </div>
        <div class="thumb-caption">Offline Map Download Setup</div>
      </button>
    

      <button class="thumb" type="button" onclick="openModal(4)" aria-label="Open Offline Map Download Progress">
        <div class="thumb-image-wrap">
          <img src="https://raw.githubusercontent.com/5lyf0x/TAK-Rig/main/screenshots/OFFLINEMAP_2.png" alt="Offline Map Download Progress" loading="lazy">
        </div>
        <div class="thumb-caption">Offline Map Download Progress</div>
      </button>
    

      <button class="thumb" type="button" onclick="openModal(5)" aria-label="Open Chat Rooms">
        <div class="thumb-image-wrap">
          <img src="https://raw.githubusercontent.com/5lyf0x/TAK-Rig/main/screenshots/CHAT.png" alt="Chat Rooms" loading="lazy">
        </div>
        <div class="thumb-caption">Chat Rooms</div>
      </button>
    

      <button class="thumb" type="button" onclick="openModal(6)" aria-label="Open Marker Icon Registry">
        <div class="thumb-image-wrap">
          <img src="https://raw.githubusercontent.com/5lyf0x/TAK-Rig/main/screenshots/MARKER.png" alt="Marker Icon Registry" loading="lazy">
        </div>
        <div class="thumb-caption">Marker Icon Registry</div>
      </button>
    

      <button class="thumb" type="button" onclick="openModal(7)" aria-label="Open Measurement Tools">
        <div class="thumb-image-wrap">
          <img src="https://raw.githubusercontent.com/5lyf0x/TAK-Rig/main/screenshots/MEASURE.png" alt="Measurement Tools" loading="lazy">
        </div>
        <div class="thumb-caption">Measurement Tools</div>
      </button>
    

      <button class="thumb" type="button" onclick="openModal(8)" aria-label="Open Elevation Heatmap">
        <div class="thumb-image-wrap">
          <img src="https://raw.githubusercontent.com/5lyf0x/TAK-Rig/main/screenshots/ELEVATION_HEATMAP.png" alt="Elevation Heatmap" loading="lazy">
        </div>
        <div class="thumb-caption">Elevation Heatmap</div>
      </button>
    

      <button class="thumb" type="button" onclick="openModal(9)" aria-label="Open Red Light Map Mode">
        <div class="thumb-image-wrap">
          <img src="https://raw.githubusercontent.com/5lyf0x/TAK-Rig/main/screenshots/REDLIGHT.png" alt="Red Light Map Mode" loading="lazy">
        </div>
        <div class="thumb-caption">Red Light Map Mode</div>
      </button>
    

      <button class="thumb" type="button" onclick="openModal(10)" aria-label="Open Toolkit Drawer">
        <div class="thumb-image-wrap">
          <img src="https://raw.githubusercontent.com/5lyf0x/TAK-Rig/main/screenshots/TOOLKIT_DRAWER.webp" alt="Toolkit Drawer" loading="lazy">
        </div>
        <div class="thumb-caption">Toolkit Drawer</div>
      </button>
    

      <button class="thumb" type="button" onclick="openModal(11)" aria-label="Open Sun / Moon">
        <div class="thumb-image-wrap">
          <img src="https://raw.githubusercontent.com/5lyf0x/TAK-Rig/main/screenshots/SUN-MOON.webp" alt="Sun / Moon" loading="lazy">
        </div>
        <div class="thumb-caption">Sun / Moon</div>
      </button>
    

      <button class="thumb" type="button" onclick="openModal(12)" aria-label="Open Viewshed Analysis">
        <div class="thumb-image-wrap">
          <img src="https://raw.githubusercontent.com/5lyf0x/TAK-Rig/main/screenshots/VIEWSHED_1.webp" alt="Viewshed Analysis" loading="lazy">
        </div>
        <div class="thumb-caption">Viewshed Analysis</div>
      </button>
    

      <button class="thumb" type="button" onclick="openModal(13)" aria-label="Open Video Streams">
        <div class="thumb-image-wrap">
          <img src="https://raw.githubusercontent.com/5lyf0x/TAK-Rig/main/screenshots/VIDEO_STREAMS.webp" alt="Video Streams" loading="lazy">
        </div>
        <div class="thumb-caption">Video Streams</div>
      </button>
    

      <button class="thumb" type="button" onclick="openModal(14)" aria-label="Open 3D Terrain">
        <div class="thumb-image-wrap">
          <img src="https://raw.githubusercontent.com/5lyf0x/TAK-Rig/main/screenshots/3D_TERRAIN_NAV.webp" alt="3D Terrain" loading="lazy">
        </div>
        <div class="thumb-caption">3D Terrain</div>
      </button>
    

      <button class="thumb" type="button" onclick="openModal(15)" aria-label="Open Navigate">
        <div class="thumb-image-wrap">
          <img src="https://raw.githubusercontent.com/5lyf0x/TAK-Rig/main/screenshots/NAVIGATE.webp" alt="Navigate" loading="lazy">
        </div>
        <div class="thumb-caption">Navigate</div>
      </button>
    

      <button class="thumb" type="button" onclick="openModal(16)" aria-label="Open Road in Navigate">
        <div class="thumb-image-wrap">
          <img src="https://raw.githubusercontent.com/5lyf0x/TAK-Rig/main/screenshots/ROAD_IN_NAVIGATE.webp" alt="Road in Navigate" loading="lazy">
        </div>
        <div class="thumb-caption">Road in Navigate</div>
      </button>
    

      <button class="thumb" type="button" onclick="openModal(17)" aria-label="Open Offroad in Navigate">
        <div class="thumb-image-wrap">
          <img src="https://raw.githubusercontent.com/5lyf0x/TAK-Rig/main/screenshots/OFFROAD_IN_NAVIGATE.webp" alt="Offroad in Navigate" loading="lazy">
        </div>
        <div class="thumb-caption">Offroad in Navigate</div>
      </button>
    

      <button class="thumb" type="button" onclick="openModal(18)" aria-label="Open Information Box">
        <div class="thumb-image-wrap">
          <img src="https://raw.githubusercontent.com/5lyf0x/TAK-Rig/main/screenshots/INFORMATION_BOX.webp" alt="Information Box" loading="lazy">
        </div>
        <div class="thumb-caption">Information Box</div>
      </button>
    

      <button class="thumb" type="button" onclick="openModal(19)" aria-label="Open 3D Terrain">
        <div class="thumb-image-wrap">
          <img src="https://raw.githubusercontent.com/5lyf0x/TAK-Rig/main/screenshots/3D_TERRAIN.webp" alt="3D Terrain" loading="lazy">
        </div>
        <div class="thumb-caption">3D Terrain</div>
      </button>
    

      <button class="thumb" type="button" onclick="openModal(20)" aria-label="Open Cell Coverage">
        <div class="thumb-image-wrap">
          <img src="https://raw.githubusercontent.com/5lyf0x/TAK-Rig/main/screenshots/CELL_COVERAGE.webp" alt="Cell Coverage" loading="lazy">
        </div>
        <div class="thumb-caption">Cell Coverage</div>
      </button>
    
  </div>

  <div class="hint"></div>
</div>

<div class="modal" id="modal" aria-hidden="true" onclick="backdropClose(event)">
  <div class="modal-shell">
    <div class="modal-top">
      <div class="modal-title" id="modalTitle"></div>
      <button class="close-btn" type="button" onclick="closeModal()" aria-label="Close">×</button>
    </div>

    <div class="stage">
      <button class="nav-arrow prev" type="button" onclick="prevImage()" aria-label="Previous screenshot">‹</button>
      <img id="modalImage" alt="">
      <button class="nav-arrow next" type="button" onclick="nextImage()" aria-label="Next screenshot">›</button>
    </div>

    <div class="modal-bottom">
      <button class="nav-btn" type="button" onclick="prevImage()">← Previous</button>
      <span class="counter" id="counter"></span>
      <button class="nav-btn" type="button" onclick="nextImage()">Next →</button>
    </div>
  </div>
</div>

<script>
const shots = [{"title": "ADS-B Aircraft Tracking", "src": "https://raw.githubusercontent.com/5lyf0x/TAK-Rig/main/screenshots/ADSB.png"}, {"title": "Route Details & Elevation Profile", "src": "https://raw.githubusercontent.com/5lyf0x/TAK-Rig/main/screenshots/ROUTE.png"}, {"title": "Basemap Selection", "src": "https://raw.githubusercontent.com/5lyf0x/TAK-Rig/main/screenshots/BASEMAPS.png"}, {"title": "Offline Map Download Setup", "src": "https://raw.githubusercontent.com/5lyf0x/TAK-Rig/main/screenshots/OFFLINEMAP_1.png"}, {"title": "Offline Map Download Progress", "src": "https://raw.githubusercontent.com/5lyf0x/TAK-Rig/main/screenshots/OFFLINEMAP_2.png"}, {"title": "Chat Rooms", "src": "https://raw.githubusercontent.com/5lyf0x/TAK-Rig/main/screenshots/CHAT.png"}, {"title": "Marker Icon Registry", "src": "https://raw.githubusercontent.com/5lyf0x/TAK-Rig/main/screenshots/MARKER.png"}, {"title": "Measurement Tools", "src": "https://raw.githubusercontent.com/5lyf0x/TAK-Rig/main/screenshots/MEASURE.png"}, {"title": "Elevation Heatmap", "src": "https://raw.githubusercontent.com/5lyf0x/TAK-Rig/main/screenshots/ELEVATION_HEATMAP.png"}, {"title": "Red Light Map Mode", "src": "https://raw.githubusercontent.com/5lyf0x/TAK-Rig/main/screenshots/REDLIGHT.png"}, {"title": "Toolkit Drawer", "src": "https://raw.githubusercontent.com/5lyf0x/TAK-Rig/main/screenshots/TOOLKIT_DRAWER.webp"}, {"title": "Sun / Moon", "src": "https://raw.githubusercontent.com/5lyf0x/TAK-Rig/main/screenshots/SUN-MOON.webp"}, {"title": "Viewshed Analysis", "src": "https://raw.githubusercontent.com/5lyf0x/TAK-Rig/main/screenshots/VIEWSHED_1.webp"}, {"title": "Video Streams", "src": "https://raw.githubusercontent.com/5lyf0x/TAK-Rig/main/screenshots/VIDEO_STREAMS.webp"}, {"title": "3D Terrain", "src": "https://raw.githubusercontent.com/5lyf0x/TAK-Rig/main/screenshots/3D_TERRAIN_NAV.webp"}, {"title": "Navigate", "src": "https://raw.githubusercontent.com/5lyf0x/TAK-Rig/main/screenshots/NAVIGATE.webp"}, {"title": "Road in Navigate", "src": "https://raw.githubusercontent.com/5lyf0x/TAK-Rig/main/screenshots/ROAD_IN_NAVIGATE.webp"}, {"title": "Offroad in Navigate", "src": "https://raw.githubusercontent.com/5lyf0x/TAK-Rig/main/screenshots/OFFROAD_IN_NAVIGATE.webp"}, {"title": "Information Box", "src": "https://raw.githubusercontent.com/5lyf0x/TAK-Rig/main/screenshots/INFORMATION_BOX.webp"}, {"title": "3D Terrain", "src": "https://raw.githubusercontent.com/5lyf0x/TAK-Rig/main/screenshots/3D_TERRAIN.webp"}, {"title": "Cell Coverage", "src": "https://raw.githubusercontent.com/5lyf0x/TAK-Rig/main/screenshots/CELL_COVERAGE.webp"}];
let current = 0;

function renderModal() {
  const s = shots[current];
  document.getElementById('modalTitle').textContent = s.title;
  const img = document.getElementById('modalImage');
  img.src = s.src;
  img.alt = s.title;
  document.getElementById('counter').textContent = `${current + 1} of ${shots.length}`;
}

function openModal(index) {
  current = index;
  renderModal();
  const modal = document.getElementById('modal');
  modal.classList.add('show');
  modal.setAttribute('aria-hidden','false');
  document.body.classList.add('modal-open');
}

function closeModal() {
  const modal = document.getElementById('modal');
  modal.classList.remove('show');
  modal.setAttribute('aria-hidden','true');
  document.body.classList.remove('modal-open');
}

function prevImage() {
  current = (current - 1 + shots.length) % shots.length;
  renderModal();
}

function nextImage() {
  current = (current + 1) % shots.length;
  renderModal();
}

function backdropClose(e) {
  if (e.target.id === 'modal') closeModal();
}

document.addEventListener('keydown', (e) => {
  const open = document.getElementById('modal').classList.contains('show');
  if (!open) return;
  if (e.key === 'Escape') closeModal();
  if (e.key === 'ArrowLeft') prevImage();
  if (e.key === 'ArrowRight') nextImage();
});

// Deep-link support for SCREENSHOTS.md thumbnails: ?shot=1 through ?shot=21
const requestedShot = Number(new URLSearchParams(location.search).get('shot'));
if (Number.isInteger(requestedShot) && requestedShot >= 1 && requestedShot <= shots.length) {
  openModal(requestedShot - 1);
}
</script>
</body>
</html>
